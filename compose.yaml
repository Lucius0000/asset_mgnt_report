services:
  amr-ui:
    build: .
    image: asset-mgnt-report
    command: streamlit run scripts/web_ui.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data/local:/app/data/local
      - ./output:/app/output
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - AMR_DEBUG=${AMR_DEBUG:-false}
      - AMR_USE_PROXY=${AMR_USE_PROXY:-false}

  amr-cli:
    build: .
    image: asset-mgnt-report
    command: python -m scripts.main
    volumes:
      - ../main:/baseline_main:ro
      - ./data/local:/app/data/local
      - ./output:/app/output
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - AMR_DEBUG=${AMR_DEBUG:-false}
      - AMR_USE_PROXY=${AMR_USE_PROXY:-false}
